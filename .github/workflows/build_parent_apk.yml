name: Build Flutter Parent App APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-parent-apk:
    name: Build Flutter Parent APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Configure Flutter Platform Scaffolding
        working-directory: parent_app
        run: |
          flutter create --org com.childguard.parent --project-name childguard_parent_app .
          flutter pub get

      - name: Build Android Debug APK for Parent App
        working-directory: parent_app
        run: flutter build apk --debug

      - name: Upload Parent Controller APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: childguard-parent-controller-apk
          path: parent_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
