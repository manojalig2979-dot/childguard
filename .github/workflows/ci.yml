name: ChildGuard AI Ecosystem CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Python Simulation & Desktop Verification
  python-test-suite:
    name: End-to-End Simulation & Python Agents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Desktop Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt

      - name: Compile Desktop Scripts
        run: |
          python -m py_compile desktop/safesearch_enforcer.py
          python -m py_compile desktop/desktop_agent.py
          python -m py_compile desktop/parent_desktop_monitor.py
          python -m py_compile cloud/analytics/behavioral_engine.py

      - name: Run E2E Simulation Test Suite
        run: |
          python simulator/e2e_simulation.py

  # 2. Golang Ingestor Pipeline Check
  go-backend-check:
    name: Go Cloud Ingestor Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Verify Go Dependencies & Build
        working-directory: cloud/ingestor
        run: |
          go mod tidy
          go vet ./...
          go build -v -o cloud_ingestor main.go

  # 3. Static Web Assets Check
  web-assets-check:
    name: Web Command Center Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Web Assets Exist
        run: |
          test -f web/index.html
          test -f web/parent_dashboard.html
          test -f web/style.css
          test -f web/app.js
          echo "All Web Command Center assets verified."
